&PARAM_ATMOS_PHY_MP_SDM
RANDOM_IN_BASENAME = "./random_number_init",
RANDOM_OUT_BASENAME = "./random_number_restart",
SD_OUT_BASENAME = "./superdroplet_restart",
domovement       = .true.,
sdm_cold         = .false., ! .false.: warm sdm, .true.: cold sdm
domeltfreeze     = .false., ! works only when sdm_cold==.true.
dosublimation    = .false., ! works only when sdm_cold==.true.
sdm_rqc2qr       = 40.d-6,
sdm_dtcmph       = 0.2d0, 0.2d0, 0.2d0, 0.2d0, 0.2d0
! condensation, coalescence, advection, melting/freezing [coldsdm only], sublimation/deposition [coldsdm only]
sdm_rdnc         = 0.d0,
sdm_sdnmlvol     = 1.25d+4,
sdm_inisdnc      = 40.0d0,
sdm_zlower       = 0.d0,
sdm_zupper       = 1400.d0,
sdm_aslset       = 5,                  ! if abs(sdm_aslset)>=10, aerosol nucleation occurs. turn this off for now
sdm_aslmw        = -999.d0,
sdm_extbuf       = 30,
sdm_aslfmrate    = 0.d0,
sdm_aslfmdt      = 0.d0,
sdm_aslfmsdnc    = 0.d0,
sdm_colbrwn      = 0,
sdm_colkrnl      = 2,
sdm_mvexchg      = 1,
sdm_nadjdt       = 0.d0,
sdm_nadjvar      = 0,  ! Control flag of adjustment super-droplet number in each grid
                ! 3:adjust number of droplet by adding and removal, 1:adjust number of droplet by adding
                ! 2:adjust number of droplet by removal 0:No adjust number of droplet
                ! use 0 and turn this function off for now
sdm_dmpvar  = 100,    ! Default: output SD_all_NetCDF_* only
               ! 1st digit (10^0) corresponds to text output
               ! 2nd digit (10^1) corresponds to binary output
               ! 3rd digit (10^2) corresponds to binary output of large droplets
               ! when sampling is enabled (tracking_fraction < 1 or max_tracked_sds > 0),
               ! set sdm_dmpvar = 100 to output sampled trajectories into SD_selected_NetCDF_*
               ! 0: off, 1: on, 2: output with sort data (only for binary output)

sdm_dmpitva  = 5.d0, ! Time interval of text output, real(RP) [s]
sdm_dmpnskip = 1,     ! Base skip to store super droplets in text format, integer
sdm_dmpitvb  = 5.d0,  ! Time interval of binary output of all droplets, real(RP) [s]
sdm_dmpitvl  = 5.d0,  ! Time interval for SD_selected_NetCDF_* when sdm_dmpvar=100, real(RP) [s]
sdm_dmpsdsiz = 0.d0,  ! Threshold radius to store large super droplets in binary format, real(RP) [m]
tracking_mode = 1,                ! Tracking mode: 0=no tracking, 1=forward tracking, 2=backward tracking


forward_tracking_enable = .true.,  ! Master switch for forward tracking
backward_tracking_enable = .false., ! Master switch for backward tracking
tracking_fraction = 0.05d0,          ! Fraction of SDs to track (0-1]
max_tracked_sds = 0,                ! Maximum number of tracked SDs (0 = unlimited)
tracking_selection_mode = "stratified", ! "random" or "stratified"
tracking_height_min = 400.d0,       ! Minimum height for stratified selection [m]
tracking_height_max = 800.d0,       ! Maximum height for stratified selection [m]
tracking_radius_min = 0.d0,         ! Minimum radius for stratified selection [m]
tracking_radius_max = 0.d0,         ! Maximum radius for stratified selection [m], <= tracking_radius_min uses runtime maximum radius
tracking_nz_bin = 8,                ! Number of vertical bins for stratified selection
tracking_nr_bin = 10,               ! Number of radius bins for stratified selection
tracking_min_per_bin = 1,           ! Minimum selected SDs per non-empty bin
tracking_fallback_to_random = .true., ! Fallback to random selection if stratified candidates are insufficient
coalescence_output_enable = .true., ! Master switch for SD_coal_output_NetCDF_* (default ON)
random_perturbation_enable = .false., ! Master switch for random perturbation in SD motion (default OFF)
random_perturbation_amp = 0.d0, ! Random perturbation amplitude [m^1.5 * s^-0.5]




/

